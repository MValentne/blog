# ============================================================
# Configuración del blog personal de Valentino Mendé
# Documentada línea por línea en CODEBASE.md
# ============================================================
baseURL = 'https://mvalentne.github.io/blog/'
locale = 'es-ar'
title = 'Valentino Mendé | Blog'
theme = 'hugo-xmin'

# Los posts van directo a /posts/<slug>/; los hilos conservan su serie en la URL.
[permalinks]
  posts = '/posts/:slug/'
  hilos = '/:sections/:slug/'
  projects = '/projects/:slug/'
  events = '/events/:slug/'

[taxonomies]
  tag = 'tags'
  category = 'categories'

# Permite HTML embebido en Markdown (tablas, iframes, figure, etc.).
[markup.goldmark.renderer]
  unsafe = true

# Fórmulas: el passthrough evita que Markdown "coma" guiones bajos y barras.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

# Como en el exampleSite de XMin: bloques de código sin resaltado extra.
[markup.highlight]
  codeFences = false

[params]
  description = 'Apuntes y proyectos de Valentino Mendé.'
  footer = '© Valentino Mendé {Year}'

