# ============================================================
# Configuración del blog personal de Valentino
# Documentada línea por línea en CODEBASE.md
# ============================================================
baseURL = 'https://mvalentne.github.io/blog/'
locale = 'es-ar'
title = 'Valentino | Blog'
theme = 'hugo-xmin'
enableRobotsTXT = true

# Los posts mantienen sus URLs históricas aunque cambie el tema.
[permalinks]
  posts = '/:sections/:slug/'
  hilos = '/:sections/:slug/'
  projects = '/projects/:slug/'
  events = '/events/:slug/'

[taxonomies]
  tag = 'tags'
  category = 'categories'

# Permite HTML embebido en Markdown (tablas, iframes, figure, etc.).
[markup.goldmark.renderer]
  unsafe = true

# Fórmulas: el passthrough evita que Markdown "coma" guiones bajos y barras.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

[markup.highlight]
  style = 'github'
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4

[params]
  author = 'Valentino'
  description = 'Cuaderno de estudio, proyectos y cosas que aprendo. Valentino.'
  footer = '© [Valentino](https://github.com/MValentne) {Year} · hecho con [Hugo](https://gohugo.io) + [XMin](https://github.com/yihui/hugo-xmin)'

# ------------------------------------------------------------
# Menú superior (XMin lo renderiza en su partial header.html)
